name: check

# TAD §B.3 — one GitHub Action running npm run check on push to main.
# Advisory, never gating: it reports; it does not block push-to-deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npm run check
