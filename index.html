<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FCC Program Integrator</title>

    <!-- Art Director's mark, made specifically for legibility at this
         size (32x32), not a scaled-down copy of the full brand mark. -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Font preload BEFORE any stylesheet (TAD §H.3, step 2). crossorigin is
         required even for a same-origin request per the CORS mode fonts load
         under; omitting it silently causes a double fetch. -->
    <link
      rel="preload"
      href="/fonts/Inter.var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
